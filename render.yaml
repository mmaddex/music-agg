# Render Blueprint: https://render.com/docs/blueprint-spec
#
# Everything the app needs: the web service, the Workflow service that runs matching and
# loading, and the Postgres database both of them share.
databases:
  - name: music-agg-db
    plan: basic-256mb
    region: oregon
    databaseName: music_agg
    user: music_agg

envVarGroups:
  # Shared by the web and Workflow services.
  - name: music-agg-shared
    envVars:
      # TIDAL app (developer.tidal.com). Not a secret: it appears in every login URL. Used by
      # the web service for login and by the workflow tasks to refresh tokens.
      - key: TIDAL_CLIENT_ID
        value: 3yg0AqbboDf4MT9r
      # Both services must decrypt the same stored TIDAL tokens.
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: NODE_VERSION
        value: "22"

services:
  - type: web
    name: music-agg
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - fromGroup: music-agg-shared
      - key: DATABASE_URL
        fromDatabase:
          name: music-agg-db
          property: connectionString
      # Where the web service starts workflow runs.
      - key: WORKFLOW_SLUG
        fromService:
          type: workflow
          name: music-agg-workflows
          property: slug
      - key: RENDER_API_KEY
        sync: false # Account settings → API keys; lets the web service start workflow runs
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      # Optional. Defaults to $RENDER_EXTERNAL_URL/auth/callback (set by Render).
      # Set it if you use a custom domain; it must match a redirect URI registered with TIDAL.
      - key: TIDAL_REDIRECT_URI
        sync: false

  # Runs matchImport / matchChunk / loadToTidal / writeCollection (src/workflows/tasks.js).
  # Workflows need an explicit region; compute plans are set per task in code.
  - type: workflow
    name: music-agg-workflows
    runtime: node
    region: oregon
    buildCommand: npm ci --omit=dev
    startCommand: npm run start:workflows
    envVars:
      - fromGroup: music-agg-shared
      - key: DATABASE_URL
        fromDatabase:
          name: music-agg-db
          property: connectionString
      # Optional tuning:
      # - key: TIDAL_MIN_INTERVAL_MS   # spacing between TIDAL calls per run (default 200)
      # - key: MATCH_CHUNK_SIZE        # tracks per matchChunk run (default 100)
      # - key: MATCH_PARALLELISM       # matchChunk runs in flight per import (default 2)
      # - key: LOG_LEVEL               # debug | info (default) | warn | error
